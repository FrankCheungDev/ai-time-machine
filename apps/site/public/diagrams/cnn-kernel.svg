  <title id="title-cnn-kernel">CNN Kernel · Local Edge Response</title>
  <desc id="desc-cnn-kernel">A 3×3 edge detector scans one window and contributes to a feature map. Representative state: edge-kernel-center. One channel and fixed weights omit training, bias, and deeper layers.</desc>
