<svg id="diagram-foundation-model" data-state="runtime-context-boundary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title-foundation-model desc-foundation-model">
  <title id="title-foundation-model">Foundation Model · Training / Inference Boundary</title>
  <desc id="desc-foundation-model">Post-training changes weights; runtime context changes one generation. Representative state: runtime-context-boundary. Scripted stages explain boundaries; no training, labeling, or inference runs.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ba9a1" /></marker>
    <marker id="arrowhead-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d5b" /></marker>
    <style>
  .title { fill: #17201d; font: 800 28px system-ui, sans-serif; }
