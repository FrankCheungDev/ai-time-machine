<svg id="diagram-decision-boundary" data-state="nonlinear-boundary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title-decision-boundary desc-decision-boundary">
  <title id="title-decision-boundary">Decision Boundary · Nonlinear Separation</title>
  <desc id="desc-decision-boundary">A curved boundary separates two sample groups without chasing one outlier. Representative state: nonlinear-boundary. Hand-authored 2D points illustrate model shape, not a training run.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ba9a1" /></marker>
    <marker id="arrowhead-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d5b" /></marker>
    <style>
  .title { fill: #17201d; font: 800 28px system-ui, sans-serif; }
  .subtitle { fill: #5f6864; font: 14px system-ui, sans-serif; }
