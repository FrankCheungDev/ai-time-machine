<svg id="diagram-rag-pipeline" data-state="grounded-answer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title-rag-pipeline desc-rag-pipeline">
  <title id="title-rag-pipeline">RAG Pipeline · Grounded Answer</title>
  <desc id="desc-rag-pipeline">Retrieved evidence is reranked, composed into context, and preserved with the answer. Representative state: grounded-answer. All nodes and outputs are scripted; no vector database or model is called.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ba9a1" /></marker>
    <marker id="arrowhead-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d5b" /></marker>
    <style>
  .title { fill: #17201d; font: 800 28px system-ui, sans-serif; }
  .subtitle { fill: #5f6864; font: 14px system-ui, sans-serif; }
